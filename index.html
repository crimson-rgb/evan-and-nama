<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evan & Nama</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    #wj-curtain {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 9999;
      pointer-events: all;
      background: transparent;
      display: block;
    }
    #backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.4s ease;
      background: #ffffff;
      z-index: 1;
    }
    #backdrop.visible { opacity: 1; pointer-events: all; }
    .eyebrow {
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 6px;
      color: #690e1a;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .names {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: clamp(52px, 11vw, 88px);
      color: #690e1a;
      line-height: 1.1;
    }
    .divider {
      width: 48px;
      height: 1px;
      background: #690e1a;
      opacity: 0.35;
      margin: 10px 0;
    }
    .tagline {
      font-family: Georgia, serif;
      font-size: 14px;
      letter-spacing: 4px;
      color: #690e1a;
      opacity: 0.7;
      text-transform: uppercase;
    }
    .enter-btn {
      margin-top: 32px;
      padding: 13px 40px;
      border: 1px solid #690e1a;
      border-radius: 100px;
      background: transparent;
      color: #690e1a;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
      text-decoration: none;
      display: inline-block;
      text-transform: uppercase;
    }
    .enter-btn:hover {
      background: #690e1a;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div id="backdrop">
    <p class="eyebrow">the wedding of</p>
    <p class="names">Evan &amp; Nama</p>
    <div class="divider"></div>
    <p class="tagline">you're invited</p>
    <a class="enter-btn" href="https://withjoy.com/evan-and-nama">open invitation</a>
  </div>

  <canvas id="wj-curtain"></canvas>

  <script>
  (function () {
    const canvas = document.getElementById('wj-curtain');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let startTime = null;
    const DURATION = 1800;
    const DELAY = 200;

    function ease(t) {
      return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    }

    /* Draw one curtain panel as a single filled path.
       folds: array of {x, light} where x is 0..1 fraction of half-width,
       light is -1..1 (negative = shadow, positive = highlight).
       The panel is drawn as a series of vertical strips between fold lines,
       each strip gets its own gradient. All strips share the same top/bottom
       so there are zero gaps. */
    function drawPanel(p, side) {
      const halfW = W / 2;
      const pullDir = side === 'left' ? -1 : 1;

      // How far the leading edge has moved off screen
      const travel = ease(p) * (halfW + 80) * pullDir;

      // Anchor x values in screen space (before pull)
      // Left panel: x goes from 0 to halfW
      // Right panel: x goes from halfW to W
      const panelStart = side === 'left' ? 0      : halfW;
      const panelEnd   = side === 'left' ? halfW  : W;

      // The pull is differential: leading edge (inner) moves most,
      // outer edge moves least — creates natural gather.
      // relPos 0 = outer edge, 1 = inner (leading) edge
      function screenX(normX) {
        // normX: 0=outer, 1=inner
        const pull = ease(p) * (halfW + 80) * pullDir * (0.25 + normX * 0.75);
        if (side === 'left') {
          return normX * halfW + pull;
        } else {
          return halfW + normX * halfW + pull;
        }
      }

      // Fold definitions: 3 gentle folds per panel
      // Each fold is a vertical crease with a light/shadow side
      const FOLDS = 3;
      const strips = [];

      // We'll divide the panel into (FOLDS*2 + 1) strips
      // alternating highlight and shadow
      const N = FOLDS * 2 + 1;
      for (let i = 0; i <= N; i++) {
        strips.push(i / N); // normX positions 0..1
      }

      // For each strip between strips[i] and strips[i+1], draw a gradient rect
      for (let i = 0; i < strips.length - 1; i++) {
        const nx0 = strips[i];
        const nx1 = strips[i + 1];

        // Screen x positions — these are the raw x without vertical wave
        const sx0 = screenX(nx0);
        const sx1 = screenX(nx1);

        if (sx1 < 0 || sx0 > W) continue;

        // Light value: peaks at strip midpoints
        // Strips at i=0,2,4,6 are face-on (lighter), i=1,3,5 are fold valleys (darker)
        const isHighlight = (i % 2 === 0);
        const lightBase = isHighlight ? 0.12 : -0.22;
        // Outer edge slightly darker (fold bunching)
        const gatherDarken = (1 - strips[i]) * 0.08 * (1 - ease(p)) ;

        // Vertical wave per strip — very subtle, just 2 gentle undulations
        const waveAmp = 6 * (1 - ease(p) * 0.6); // reduces as curtain opens
        const waveFreq = 2;
        const phase = nx0 * Math.PI * 1.2;

        // Build the strip as a path with wavy left and right edges
        const SEGS = 24;
        const leftPts  = [];
        const rightPts = [];

        for (let s = 0; s <= SEGS; s++) {
          const yf = s / SEGS;
          const y  = yf * H;
          const waveL = Math.sin(yf * Math.PI * waveFreq + phase) * waveAmp;
          const waveR = Math.sin(yf * Math.PI * waveFreq + phase + 0.4) * waveAmp;
          leftPts.push({ x: sx0 + waveL, y });
          rightPts.push({ x: sx1 + waveR, y });
        }

        // Draw path
        ctx.beginPath();
        ctx.moveTo(leftPts[0].x, leftPts[0].y);
        for (let s = 1; s <= SEGS; s++) {
          const prev = leftPts[s-1], curr = leftPts[s];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x+curr.x)/2, (prev.y+curr.y)/2);
        }
        // Right edge bottom to top
        ctx.lineTo(rightPts[SEGS].x, rightPts[SEGS].y);
        for (let s = SEGS - 1; s >= 0; s--) {
          const prev = rightPts[s+1], curr = rightPts[s];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x+curr.x)/2, (prev.y+curr.y)/2);
        }
        ctx.closePath();

        // Gradient across strip width
        const grad = ctx.createLinearGradient(sx0, 0, sx1, 0);

        const base  = 105, baseG = 14, baseB = 26;
        const lv = lightBase - gatherDarken;

        function clamp(v) { return Math.min(255, Math.max(0, Math.round(v))); }
        const r0 = clamp(base + lv * 160);
        const g0 = clamp(baseG + lv * 60);
        const b0 = clamp(baseB + lv * 60);
        const rM = clamp(base + (lv + 0.08) * 160);
        const gM = clamp(baseG + (lv + 0.08) * 60);
        const bM = clamp(baseB + (lv + 0.08) * 60);

        grad.addColorStop(0,   `rgb(${r0},${g0},${b0})`);
        grad.addColorStop(0.5, `rgb(${rM},${gM},${bM})`);
        grad.addColorStop(1,   `rgb(${r0},${g0},${b0})`);

        ctx.fillStyle = grad;
        ctx.fill();
      }

      // Inner edge shadow — darkens the very leading edge for depth
      const innerX = screenX(1);
      if (side === 'left' && innerX > 0 && innerX < W) {
        const shadowW = 18;
        const sg = ctx.createLinearGradient(innerX - shadowW, 0, innerX, 0);
        sg.addColorStop(0, 'rgba(30,0,5,0)');
        sg.addColorStop(1, 'rgba(30,0,5,0.28)');
        ctx.fillStyle = sg;
        ctx.fillRect(innerX - shadowW, 0, shadowW, H);
      }
      if (side === 'right' && innerX > 0 && innerX < W) {
        const shadowW = 18;
        const sg = ctx.createLinearGradient(innerX, 0, innerX + shadowW, 0);
        sg.addColorStop(0, 'rgba(30,0,5,0.28)');
        sg.addColorStop(1, 'rgba(30,0,5,0)');
        ctx.fillStyle = sg;
        ctx.fillRect(innerX, 0, shadowW, H);
      }
    }

    function drawRod() {
      ctx.fillStyle = '#2a0509';
      ctx.fillRect(0, 0, W, 6);
      [9, W-9].forEach(tx => {
        ctx.fillStyle = '#2a0509';
        ctx.beginPath();
        ctx.arc(tx, 3, 9, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#690e1a';
        ctx.beginPath();
        ctx.arc(tx, 2, 4.5, 0, Math.PI*2);
        ctx.fill();
      });
    }

    function drawTassels(p) {
      const ep = ease(p);
      const lx = W/2 - 10 - ep*(W/2+32);
      const rx = W/2 + 10 + ep*(W/2+32);

      [lx, rx].forEach(tx => {
        const sw = Math.sin(p * Math.PI * 2.5) * 4 * (1 - p);

        // Cord
        ctx.strokeStyle = '#2a0509';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(tx + sw, 6);
        ctx.quadraticCurveTo(tx + sw*1.1, 38, tx + sw*0.9, 58);
        ctx.stroke();

        // Knot
        ctx.fillStyle = '#2a0509';
        ctx.beginPath();
        ctx.ellipse(tx + sw*0.9, 61, 4, 2.5, 0, 0, Math.PI*2);
        ctx.fill();

        // Fringe strands
        for (let i = 0; i < 5; i++) {
          const a = (i/4 - 0.5) * 0.6;
          const ex = tx + sw*0.9 + Math.sin(a)*11;
          const ey = 61 + Math.cos(Math.abs(a))*20;
          ctx.strokeStyle = `rgba(90,10,20,${0.5+(i%2)*0.2})`;
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(tx + sw*0.9, 63);
          ctx.quadraticCurveTo(
            tx + sw*0.9 + Math.sin(a+0.25)*6,
            (63+ey)/2,
            ex, ey
          );
          ctx.stroke();
        }
      });
    }

    function frame(ts) {
      if (!startTime) startTime = ts;
      const elapsed = ts - startTime - DELAY;
      const raw = elapsed < 0 ? 0 : Math.min(1, elapsed / DURATION);

      ctx.clearRect(0, 0, W, H);
      drawPanel(raw, 'left');
      drawPanel(raw, 'right');
      drawTassels(raw);
      drawRod();

      if (raw < 1) {
        requestAnimationFrame(frame);
      } else {
        canvas.style.pointerEvents = 'none';
        document.getElementById('backdrop').classList.add('visible');
      }
    }

    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
