<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evan & Nama</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a0a04;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #wj-curtain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      pointer-events: all;
      background: transparent;
      display: block;
    }

    #backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease 1.8s;
    }

    #backdrop.visible {
      opacity: 1;
    }

    #backdrop .eyebrow {
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 5px;
      color: #8a6a40;
    }

    #backdrop .names {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: clamp(28px, 6vw, 48px);
      color: #3a1e08;
    }

    #backdrop .tagline {
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: #7a5020;
      margin-top: 4px;
    }

    #backdrop .enter-btn {
      margin-top: 24px;
      padding: 10px 32px;
      border: 1px solid #b89040;
      background: transparent;
      color: #7a5020;
      font-family: Georgia, serif;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      pointer-events: all;
      transition: background 0.3s, color 0.3s;
    }

    #backdrop .enter-btn:hover {
      background: #b89040;
      color: #fff8f0;
    }
  </style>
</head>
<body>

  <div id="backdrop">
    <p class="eyebrow">— WITH JOY —</p>
    <p class="names">Evan &amp; Nama</p>
    <p class="tagline">You're Invited</p>
    <button class="enter-btn" onclick="window.location.href='https://withjoy.com/evan-and-nama'">
      Open Invitation
    </button>
  </div>

  <canvas id="wj-curtain"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('wj-curtain');
      const ctx = canvas.getContext('2d');
      let W, H;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const COLS = 40;
      let startTime = null;
      const DURATION = 3200;
      const DELAY = 400;

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function getFoldDepth(col, side, pullFactor) {
        const half = COLS / 2;
        const relPos = side === 'left' ? col / half : (COLS - 1 - col) / half;
        const bunching = Math.pow(1 - pullFactor, 1.8);
        const foldFreq = 5 + relPos * 3;
        const foldAmp = 18 * (1 - relPos * 0.3) * (bunching * 0.7 + 0.3);
        return Math.sin(relPos * Math.PI * foldFreq) * foldAmp;
      }

      function getLightness(col, side, pullFactor) {
        const half = COLS / 2;
        const relPos = side === 'left' ? col / half : (COLS - 1 - col) / half;
        const bunching = Math.pow(1 - pullFactor, 1.8);
        const foldFreq = 5 + relPos * 3;
        const wave = Math.sin(relPos * Math.PI * foldFreq);
        const shadowDepth = 0.45 * (bunching * 0.6 + 0.4);
        return wave * shadowDepth;
      }

      function drawCurtainSide(pullFactor, side) {
        const half = COLS / 2;
        const colW = W / COLS;
        const startCol = side === 'left' ? 0 : half;
        const endCol = side === 'left' ? half : COLS;
        const maxPull = side === 'left' ? -(W / 2 + 60) : (W / 2 + 60);

        for (let col = startCol; col < endCol; col++) {
          const relPos = side === 'left' ? col / half : (COLS - 1 - col) / half;
          const colPull = pullFactor * maxPull * (0.3 + relPos * 0.7);
          const x0 = col * colW + colPull;
          const x1 = (col + 1) * colW + colPull;

          if (x1 < 0 || x0 > W) continue;

          const lightness = getLightness(col, side, pullFactor);
          const baseR = 105, baseG = 14, baseB = 26;
          const r = Math.min(255, Math.max(0, baseR + lightness * 180));
          const g = Math.min(255, Math.max(0, baseG + lightness * 80));
          const b = Math.min(255, Math.max(0, baseB + lightness * 80));
          const foldDepth = getFoldDepth(col, side, pullFactor);

          const grad = ctx.createLinearGradient(x0, 0, x1, 0);
          const edgeR = Math.min(255, Math.max(0, r - 30));
          const edgeG = Math.min(255, Math.max(0, g - 8));
          const edgeB = Math.min(255, Math.max(0, b - 8));
          grad.addColorStop(0, `rgb(${edgeR},${edgeG},${edgeB})`);
          grad.addColorStop(0.5, `rgb(${r},${g},${b})`);
          grad.addColorStop(1, `rgb(${edgeR},${edgeG},${edgeB})`);

          const segments = 18;
          const points = [];
          for (let s = 0; s <= segments; s++) {
            const yFrac = s / segments;
            const y = yFrac * H;
            const wave = Math.sin(yFrac * Math.PI * 3.5 + relPos * 0.8) * foldDepth * (1 - yFrac * 0.25);
            const swayT = Math.sin(yFrac * Math.PI) * 0.12 * pullFactor;
            points.push({ xl: x0 + wave * 0.4 + swayT * colW, xr: x1 + wave * 0.4 + swayT * colW, y });
          }

          ctx.beginPath();
          ctx.moveTo(points[0].xl, points[0].y);
          for (let s = 1; s < points.length; s++) {
            const prev = points[s - 1], curr = points[s];
            ctx.quadraticCurveTo(prev.xl, prev.y, (prev.xl + curr.xl) / 2, (prev.y + curr.y) / 2);
          }
          ctx.lineTo(points[points.length - 1].xr, points[points.length - 1].y);
          for (let s = points.length - 2; s >= 0; s--) {
            const prev = points[s + 1], curr = points[s];
            ctx.quadraticCurveTo(prev.xr, prev.y, (prev.xr + curr.xr) / 2, (prev.y + curr.y) / 2);
          }
          ctx.closePath();
          ctx.fillStyle = grad;
          ctx.fill();

          const sheen = ctx.createLinearGradient(x0, 0, x1, 0);
          sheen.addColorStop(0, 'rgba(255,180,140,0)');
          sheen.addColorStop(0.5, `rgba(255,200,160,${0.07 + Math.abs(lightness) * 0.05})`);
          sheen.addColorStop(1, 'rgba(255,180,140,0)');
          ctx.fillStyle = sheen;
          ctx.fill();
        }
      }

      function drawRod() {
        const rodH = 9;
        const rod = ctx.createLinearGradient(0, 0, 0, rodH);
        rod.addColorStop(0, '#e8c86a');
        rod.addColorStop(0.4, '#f5e090');
        rod.addColorStop(0.7, '#c9a030');
        rod.addColorStop(1, '#8a6010');
        ctx.fillStyle = rod;
        ctx.fillRect(0, 0, W, rodH);
        [6, W - 6].forEach(tx => {
          ctx.fillStyle = '#d4a830';
          ctx.beginPath(); ctx.arc(tx, 4.5, 7, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#f0d060';
          ctx.beginPath(); ctx.arc(tx - 1, 3.5, 3, 0, Math.PI * 2); ctx.fill();
        });
      }

      function drawTassels(pullFactor) {
        const lx = W / 2 - 8 - pullFactor * (W / 2 + 30);
        const rx = W / 2 + 8 + pullFactor * (W / 2 + 30);
        [lx, rx].forEach(tx => {
          const swing = Math.sin(pullFactor * Math.PI * 2.5) * 6 * (1 - pullFactor);
          ctx.strokeStyle = '#c8a030';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(tx + swing, 9);
          ctx.quadraticCurveTo(tx + swing * 1.2, 45, tx + swing * 0.8, 72);
          ctx.stroke();

          ctx.fillStyle = '#b89020';
          ctx.beginPath();
          ctx.ellipse(tx + swing * 0.8, 75, 7, 4, 0, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < 7; i++) {
            const angle = (i / 6 - 0.5) * 0.8;
            const endX = tx + swing * 0.8 + Math.sin(angle) * 18;
            const endY = 75 + Math.cos(Math.abs(angle)) * 30;
            ctx.strokeStyle = `rgba(200,160,40,${0.5 + (i % 2) * 0.2})`;
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(tx + swing * 0.8, 79);
            ctx.quadraticCurveTo(tx + swing * 0.8 + Math.sin(angle + 0.3) * 10, (79 + endY) / 2, endX, endY);
            ctx.stroke();
          }
        });
      }

      function frame(ts) {
        if (!startTime) startTime = ts;
        const elapsed = ts - startTime - DELAY;
        const rawProgress = elapsed < 0 ? 0 : Math.min(1, elapsed / DURATION);
        const pullFactor = easeInOutCubic(rawProgress);

        ctx.clearRect(0, 0, W, H);
        drawCurtainSide(pullFactor, 'left');
        drawCurtainSide(pullFactor, 'right');
        drawTassels(pullFactor);
        drawRod();

        if (rawProgress < 1) {
          requestAnimationFrame(frame);
        } else {
          canvas.style.pointerEvents = 'none';
          document.getElementById('backdrop').classList.add('visible');
        }
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
